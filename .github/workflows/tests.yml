name: tests

on:
  push:
    branches:
      - main
      - develop
      - TESTS
      - hotfix/finish-maintenance-main
      - hotfix/finish-maintenance-develop
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stackmonster_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: stackmonster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stackmonster_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:stackmonster_test@127.0.0.1:5432/stackmonster_test
      SESSION_SECRET: stackmonster-ci-session-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend unit tests
        run: pnpm test
      - name: API integration tests
        run: python -m pytest tests
      - name: Production build
        run: pnpm build
